<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIMMY.RENDER</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: #0c0405;
      }
    </style>
    <script>
      (function () {
        if (window.self !== window.top) return;
        const isPortrait = window.innerHeight >= window.innerWidth;
        const isMobile =
          /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
          window.innerWidth <= 768;
        const target = isPortrait || isMobile ? "mobile.html" : "desktop.html";
        const segments = window.location.pathname.split("/").filter(Boolean);
        const base = window.location.hostname.endsWith("github.io") && segments.length > 0 ? "/" + segments[0] + "/" : "/";
        window.location.replace(base + target + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
